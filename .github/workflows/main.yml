
name: Generar APK Zona Doble E

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar proyecto
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Crear archivos Android
        run: flutter create --platforms=android .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar APK y revisar firma
        run: |
          flutter build apk --release
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Zona-Doble-E-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
